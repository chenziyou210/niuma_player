group = "cn.niuma.niuma_player"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def niumaLocalMaven = file("${project.projectDir}/localmaven")
rootProject.allprojects { proj ->
    proj.repositories { maven { url = uri(niumaLocalMaven) } }
}

android {
    namespace = "cn.niuma.niuma_player"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 21
        // Propagate our JNI-safety rules into any app that uses this plugin
        // so release/minified builds don't SIGSEGV inside libijkplayer.so.
        consumerProguardFiles "consumer-rules.pro"
    }

    dependencies {
        testImplementation("junit:junit:4.13.2")
        // IJK 软解兜底：自编 FFmpeg 8.1 产物，vendored 在 ../localmaven/
        // （ShikinChen/ijkplayer-android JNI + 上游 FFmpeg n8.1 + 本仓 3 个
        // 补丁，OpenSSL 3.2 静态，c++_static 不带 libc++_shared，
        // arm64-v8a + armeabi-v7a）。这是目前唯一能正确播 H.265 fMP4 分片
        // HLS 的产物——GSY 官方 / FFmpeg 4.x 产物 fMP4 位置恒 0、seek 永久卡
        // buffering，别换回去。版本事实源 scripts/compile/VERSIONS.lock，
        // 根因与实测 doc/ijk-fmp4-hls.md。
        implementation("tv.danmaku.ijk:ijkplayer:0.8.8-ff8.1-static-20260727@aar")
        // ContextCompat.registerReceiver：PiP 遥控 receiver 的 NOT_EXPORTED
        // 保护需要 androidx.core 在 API ≤32 上背书（用应用私有签名权限），
        // 裸 registerReceiver 在旧版本上隐式导出、可被任意应用触发。
        implementation("androidx.core:core:1.13.1")
    }
}
