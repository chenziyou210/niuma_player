name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze + Test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # pubspec 声明的最低版本：保证 >=3.27.0 这个下限是真的
          - label: floor 3.27.0
            flutter-version: '3.27.0'
          # 浮动 stable：提前发现新版本的破坏性变更
          - label: latest stable
            flutter-version: ''
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: podspec 版本与 pubspec 一致
        run: |
          PUB=$(sed -n 's/^version: *//p' pubspec.yaml)
          grep -q "s.version *= *'$PUB'" ios/niuma_player.podspec \
            || { echo "ios/niuma_player.podspec 的 s.version 与 pubspec.yaml 的 $PUB 不一致"; exit 1; }

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --coverage

      - name: flutter test (browser, WebVideoBackend)
        run: flutter test --platform chrome test/web

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android (example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 校验 vendored IJK aar 的 SHA-256（事实源 VERSIONS.lock）
        run: |
          LOCK=android/scripts/compile/VERSIONS.lock
          VER=$(sed -n 's/^AAR_VERSION=//p' $LOCK)
          SHA=$(sed -n 's/^AAR_SHA256=//p' $LOCK)
          AAR=android/localmaven/tv/danmaku/ijk/ijkplayer/$VER/ijkplayer-$VER.aar
          echo "$SHA  $AAR" | sha256sum -c -

      - name: flutter pub get
        working-directory: example
        run: flutter pub get

      - name: flutter build apk --debug
        working-directory: example
        run: flutter build apk --debug

  build-web:
    name: Build Web (example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: example
        run: flutter pub get

      - name: flutter build web
        working-directory: example
        run: flutter build web

  build-ios:
    name: Build iOS (example, no codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: example
        run: flutter pub get

      - name: flutter build ios --debug --no-codesign
        working-directory: example
        run: flutter build ios --debug --no-codesign
